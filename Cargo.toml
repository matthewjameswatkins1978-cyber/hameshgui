[workspace]
members = [
  "crates/hamesh-core",
  "crates/hamesh-layout",
  "crates/hamesh-scene",
  "crates/hamesh-render",
  "crates/hamesh-inspect",
  "crates/hamesh-automation",
  "crates/hamesh-diag",
  "crates/hamesh-window",
  "apps/demo",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/matthewjameswatkins1978-cyber/hameshgui"
rust-version = "1.89"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
taffy = "0.15"
tiny-skia = "0.11"
