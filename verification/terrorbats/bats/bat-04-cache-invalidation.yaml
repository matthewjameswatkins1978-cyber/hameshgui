version: terrorbat/v1
id: bat-04-cache-invalidation
claim:
  text: Changes to content, font generation or relevant style inputs invalidate every dependent cached result.
requires:
  - process.spawn
  - git.inspect
  - fs.write
attack:
  setup:
    - adapter: fs
      action: write
      path: crates/hamesh-window/tests/adversarial_040.rs
      from: ../probes/adversarial_040.rs
  run:
    - adapter: command
      action: run
      program: cargo
      args: [test, --test, adversarial_040, --, --nocapture, test_bat_04_cache_invalidation]
      env:
        CARGO_TARGET_DIR: D:/Projects/hameshgui/target
oracle:
  type: exit_code
  step: run:0
  not_equals: 0
evidence:
  capture:
    - stdout
    - stderr
timeout:
  run: 60s
