version: terrorbat/v1
id: bat-03-text-corruption
claim:
  text: Cached text shaping preserves accurate measurements and rendered text.
requires:
  - process.spawn
  - git.inspect
  - fs.write
attack:
  setup:
    - adapter: fs
      action: write
      path: crates/hamesh-window/tests/adversarial_040.rs
      from: ../probes/adversarial_040.rs
  run:
    - adapter: command
      action: run
      program: cargo
      args: [test, --test, adversarial_040, --, --nocapture, test_bat_03_text_corruption]
      env:
        CARGO_TARGET_DIR: D:/Projects/hameshgui/target
oracle:
  type: exit_code
  step: run:0
  not_equals: 0
evidence:
  capture:
    - stdout
    - stderr
timeout:
  run: 60s
